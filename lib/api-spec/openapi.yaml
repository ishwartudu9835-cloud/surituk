openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: MangaVerse Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: manga
  - name: chapters
  - name: creators
  - name: users
  - name: leaderboard
  - name: community
  - name: contests
  - name: genres
  - name: search
  - name: stats

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ────────────────────────────────────────────────
  # MANGA
  # ────────────────────────────────────────────────
  /manga:
    get:
      operationId: listManga
      tags: [manga]
      summary: List manga with filters
      parameters:
        - name: genre
          in: query
          schema: { type: string }
        - name: language
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [trending, popular, latest, new] }
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List of manga
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Manga"
    post:
      operationId: createManga
      tags: [manga]
      summary: Create a new manga
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MangaInput"
      responses:
        "201":
          description: Created manga
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manga"

  /manga/trending:
    get:
      operationId: getTrendingManga
      tags: [manga]
      summary: Get trending manga
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Trending manga
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Manga"

  /manga/featured:
    get:
      operationId: getFeaturedManga
      tags: [manga]
      summary: Get featured/hero manga
      responses:
        "200":
          description: Featured manga
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Manga"

  /manga/new-releases:
    get:
      operationId: getNewReleases
      tags: [manga]
      summary: Get new releases
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 12 }
      responses:
        "200":
          description: New releases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Manga"

  /manga/top-monthly:
    get:
      operationId: getTopMonthlyManga
      tags: [manga]
      summary: Get top 3 manga of the month
      responses:
        "200":
          description: Top monthly manga
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Manga"

  /manga/{mangaId}:
    get:
      operationId: getManga
      tags: [manga]
      summary: Get a manga by ID
      parameters:
        - name: mangaId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Manga details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manga"
        "404":
          description: Not found

  /manga/{mangaId}/like:
    post:
      operationId: likeManga
      tags: [manga]
      summary: Like a manga
      parameters:
        - name: mangaId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Like updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"

  # ────────────────────────────────────────────────
  # CHAPTERS
  # ────────────────────────────────────────────────
  /manga/{mangaId}/chapters:
    get:
      operationId: listChapters
      tags: [chapters]
      summary: List chapters for a manga
      parameters:
        - name: mangaId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: List of chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chapter"
    post:
      operationId: createChapter
      tags: [chapters]
      summary: Upload a new chapter
      parameters:
        - name: mangaId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterInput"
      responses:
        "201":
          description: Created chapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"

  /manga/{mangaId}/chapters/{chapterId}:
    get:
      operationId: getChapter
      tags: [chapters]
      summary: Get chapter details
      parameters:
        - name: mangaId
          in: path
          required: true
          schema: { type: integer }
        - name: chapterId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Chapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"

  /chapters/latest:
    get:
      operationId: getLatestChapters
      tags: [chapters]
      summary: Get recently updated chapters
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 12 }
      responses:
        "200":
          description: Latest chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chapter"

  # ────────────────────────────────────────────────
  # CREATORS
  # ────────────────────────────────────────────────
  /creators:
    get:
      operationId: listCreators
      tags: [creators]
      summary: List creators
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: List of creators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Creator"

  /creators/top:
    get:
      operationId: getTopCreators
      tags: [creators]
      summary: Get top performing creators
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [weekly, monthly, alltime] }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Top creators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Creator"

  /creators/spotlight:
    get:
      operationId: getCreatorSpotlight
      tags: [creators]
      summary: Get featured creator spotlight
      responses:
        "200":
          description: Spotlight creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creator"

  /creators/{creatorId}:
    get:
      operationId: getCreator
      tags: [creators]
      summary: Get creator profile
      parameters:
        - name: creatorId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Creator profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creator"

  /creators/{creatorId}/analytics:
    get:
      operationId: getCreatorAnalytics
      tags: [creators]
      summary: Get creator dashboard analytics
      parameters:
        - name: creatorId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Creator analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorAnalytics"

  /creators/{creatorId}/revenue:
    get:
      operationId: getCreatorRevenue
      tags: [creators]
      summary: Get creator revenue breakdown
      parameters:
        - name: creatorId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Revenue data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueData"

  # ────────────────────────────────────────────────
  # USERS
  # ────────────────────────────────────────────────
  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}/reading-history:
    get:
      operationId: getUserReadingHistory
      tags: [users]
      summary: Get user reading history
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reading history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadingEntry"

  /users/{userId}/bookmarks:
    get:
      operationId: getUserBookmarks
      tags: [users]
      summary: Get user saved/bookmarked manga
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Bookmarks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Manga"

  /users/{userId}/rewards:
    get:
      operationId: getUserRewards
      tags: [users]
      summary: Get user reward/points summary
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reward summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardSummary"

  /users/{userId}/notifications:
    get:
      operationId: getUserNotifications
      tags: [users]
      summary: Get user notifications
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  # ────────────────────────────────────────────────
  # LEADERBOARD
  # ────────────────────────────────────────────────
  /leaderboard/manga:
    get:
      operationId: getMangaLeaderboard
      tags: [leaderboard]
      summary: Get manga leaderboard
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [weekly, monthly] }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Manga leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboard/creators:
    get:
      operationId: getCreatorLeaderboard
      tags: [leaderboard]
      summary: Get creator leaderboard
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [weekly, monthly] }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Creator leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreatorLeaderboardEntry"

  # ────────────────────────────────────────────────
  # CONTESTS & QUIZZES
  # ────────────────────────────────────────────────
  /contests:
    get:
      operationId: listContests
      tags: [contests]
      summary: List active contests
      responses:
        "200":
          description: Contests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contest"

  /contests/{contestId}:
    get:
      operationId: getContest
      tags: [contests]
      summary: Get contest details
      parameters:
        - name: contestId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Contest details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contest"

  /contests/{contestId}/winners:
    get:
      operationId: getContestWinners
      tags: [contests]
      summary: Get contest winners
      parameters:
        - name: contestId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Contest winners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContestWinner"

  # ────────────────────────────────────────────────
  # COMMUNITY
  # ────────────────────────────────────────────────
  /community/posts:
    get:
      operationId: listCommunityPosts
      tags: [community]
      summary: List community posts
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [discussion, review, announcement, poll] }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Community posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityPost"
    post:
      operationId: createCommunityPost
      tags: [community]
      summary: Create a community post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPost"

  # ────────────────────────────────────────────────
  # GENRES
  # ────────────────────────────────────────────────
  /genres:
    get:
      operationId: listGenres
      tags: [genres]
      summary: List all genres with counts
      responses:
        "200":
          description: Genres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Genre"

  # ────────────────────────────────────────────────
  # PLATFORM STATS (wow endpoint)
  # ────────────────────────────────────────────────
  /stats/platform:
    get:
      operationId: getPlatformStats
      tags: [stats]
      summary: Get platform-wide stats summary
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

# ────────────────────────────────────────────────
# SCHEMAS
# ────────────────────────────────────────────────
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Manga:
      type: object
      required: [id, title, creatorId, coverImage, genre, status, views, likes, chapterCount, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        creatorId: { type: integer }
        creatorName: { type: string }
        creatorAvatar: { type: ["string", "null"] }
        coverImage: { type: string }
        bannerImage: { type: ["string", "null"] }
        genre: { type: string }
        tags:
          type: array
          items: { type: string }
        language: { type: string }
        status: { type: string, enum: [ongoing, completed, hiatus] }
        views: { type: integer }
        likes: { type: integer }
        chapterCount: { type: integer }
        rating: { type: number }
        isFeatured: { type: boolean }
        isSponsored: { type: boolean }
        weeklyRank: { type: ["integer", "null"] }
        monthlyRank: { type: ["integer", "null"] }
        createdAt: { type: string }
        updatedAt: { type: ["string", "null"] }

    MangaInput:
      type: object
      required: [title, genre, language]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        coverImage: { type: string }
        bannerImage: { type: string }
        genre: { type: string }
        tags:
          type: array
          items: { type: string }
        language: { type: string }

    Chapter:
      type: object
      required: [id, mangaId, chapterNumber, title, pages, views, createdAt]
      properties:
        id: { type: integer }
        mangaId: { type: integer }
        mangaTitle: { type: ["string", "null"] }
        chapterNumber: { type: number }
        title: { type: string }
        pages:
          type: array
          items: { type: string }
        views: { type: integer }
        isScheduled: { type: boolean }
        scheduledAt: { type: ["string", "null"] }
        createdAt: { type: string }

    ChapterInput:
      type: object
      required: [chapterNumber, title, pages]
      properties:
        chapterNumber: { type: number }
        title: { type: string }
        pages:
          type: array
          items: { type: string }
        scheduledAt: { type: string }

    Creator:
      type: object
      required: [id, name, avatar, totalManga, totalViews, followers, joinedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        studioName: { type: ["string", "null"] }
        avatar: { type: string }
        banner: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        totalManga: { type: integer }
        totalViews: { type: integer }
        totalLikes: { type: integer }
        followers: { type: integer }
        revenue: { type: ["number", "null"] }
        socialLinks:
          type: object
          properties:
            twitter: { type: ["string", "null"] }
            instagram: { type: ["string", "null"] }
            website: { type: ["string", "null"] }
        isVerified: { type: boolean }
        rank: { type: ["integer", "null"] }
        joinedAt: { type: string }

    CreatorAnalytics:
      type: object
      required: [totalViews, totalReads, totalLikes, totalFollowers, weeklyViews, monthlyViews, viewsByDay]
      properties:
        totalViews: { type: integer }
        totalReads: { type: integer }
        totalLikes: { type: integer }
        totalFollowers: { type: integer }
        weeklyViews: { type: integer }
        monthlyViews: { type: integer }
        viewsByDay:
          type: array
          items:
            type: object
            required: [date, views]
            properties:
              date: { type: string }
              views: { type: integer }
        topManga:
          type: array
          items:
            type: object
            required: [id, title, views]
            properties:
              id: { type: integer }
              title: { type: string }
              views: { type: integer }

    RevenueData:
      type: object
      required: [totalRevenue, adsRevenue, bonusRevenue, monthlyRevenue]
      properties:
        totalRevenue: { type: number }
        adsRevenue: { type: number }
        bonusRevenue: { type: number }
        donationRevenue: { type: number }
        monthlyRevenue:
          type: array
          items:
            type: object
            required: [month, amount]
            properties:
              month: { type: string }
              amount: { type: number }

    User:
      type: object
      required: [id, username, displayName, avatar, points, rank, joinedAt]
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: string }
        avatar: { type: string }
        bio: { type: ["string", "null"] }
        points: { type: integer }
        weeklyPoints: { type: integer }
        monthlyPoints: { type: integer }
        rank: { type: ["integer", "null"] }
        completedManga: { type: integer }
        joinedAt: { type: string }

    ReadingEntry:
      type: object
      required: [mangaId, mangaTitle, coverImage, lastChapter, lastReadAt]
      properties:
        mangaId: { type: integer }
        mangaTitle: { type: string }
        coverImage: { type: string }
        lastChapter: { type: integer }
        progress: { type: number }
        lastReadAt: { type: string }
        isCompleted: { type: boolean }

    RewardSummary:
      type: object
      required: [totalPoints, weeklyPoints, monthlyPoints, tokens, contestEntries, winningHistory]
      properties:
        totalPoints: { type: integer }
        weeklyPoints: { type: integer }
        monthlyPoints: { type: integer }
        tokens: { type: integer }
        contestEntries: { type: integer }
        winningHistory:
          type: array
          items:
            type: object
            required: [contestName, prize, wonAt]
            properties:
              contestName: { type: string }
              prize: { type: string }
              wonAt: { type: string }

    Notification:
      type: object
      required: [id, type, message, isRead, createdAt]
      properties:
        id: { type: integer }
        type: { type: string, enum: [new_chapter, contest, reward, system] }
        message: { type: string }
        relatedId: { type: ["integer", "null"] }
        isRead: { type: boolean }
        createdAt: { type: string }

    LeaderboardEntry:
      type: object
      required: [rank, mangaId, title, coverImage, views, likes, trend]
      properties:
        rank: { type: integer }
        mangaId: { type: integer }
        title: { type: string }
        coverImage: { type: string }
        creatorName: { type: string }
        views: { type: integer }
        likes: { type: integer }
        trend: { type: string, enum: [up, down, stable, new] }
        change: { type: integer }

    CreatorLeaderboardEntry:
      type: object
      required: [rank, creatorId, name, avatar, totalViews, followers]
      properties:
        rank: { type: integer }
        creatorId: { type: integer }
        name: { type: string }
        avatar: { type: string }
        studioName: { type: ["string", "null"] }
        totalViews: { type: integer }
        followers: { type: integer }
        prize: { type: ["string", "null"] }
        trend: { type: string, enum: [up, down, stable, new] }

    Contest:
      type: object
      required: [id, title, type, description, prizePool, startDate, endDate, status]
      properties:
        id: { type: integer }
        title: { type: string }
        type: { type: string, enum: [weekly_quiz, monthly_mega, special] }
        description: { type: string }
        prizePool: { type: string }
        entryTokenCost: { type: integer }
        startDate: { type: string }
        endDate: { type: string }
        status: { type: string, enum: [upcoming, active, ended] }
        participantCount: { type: integer }
        rules:
          type: array
          items: { type: string }
        prizes:
          type: array
          items:
            type: object
            required: [place, reward]
            properties:
              place: { type: integer }
              reward: { type: string }

    ContestWinner:
      type: object
      required: [place, userId, username, avatar, prize]
      properties:
        place: { type: integer }
        userId: { type: integer }
        username: { type: string }
        avatar: { type: string }
        prize: { type: string }

    CommunityPost:
      type: object
      required: [id, type, title, content, authorId, authorName, authorAvatar, likes, replies, createdAt]
      properties:
        id: { type: integer }
        type: { type: string, enum: [discussion, review, announcement, poll] }
        title: { type: string }
        content: { type: string }
        authorId: { type: integer }
        authorName: { type: string }
        authorAvatar: { type: string }
        relatedMangaId: { type: ["integer", "null"] }
        relatedMangaTitle: { type: ["string", "null"] }
        likes: { type: integer }
        replies: { type: integer }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string }

    CommunityPostInput:
      type: object
      required: [type, title, content]
      properties:
        type: { type: string, enum: [discussion, review, announcement, poll] }
        title: { type: string }
        content: { type: string }
        relatedMangaId: { type: integer }
        tags:
          type: array
          items: { type: string }

    Genre:
      type: object
      required: [id, name, slug, mangaCount, color]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        mangaCount: { type: integer }
        color: { type: string }
        icon: { type: ["string", "null"] }

    LikeResult:
      type: object
      required: [liked, totalLikes]
      properties:
        liked: { type: boolean }
        totalLikes: { type: integer }

    PlatformStats:
      type: object
      required: [totalManga, totalCreators, totalReaders, totalChapters, totalViews]
      properties:
        totalManga: { type: integer }
        totalCreators: { type: integer }
        totalReaders: { type: integer }
        totalChapters: { type: integer }
        totalViews: { type: integer }
        activeContests: { type: integer }
        totalPrizeDistributed: { type: string }
